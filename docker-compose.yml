version: "3.4"

services:
  mysql:
    image: mysql
    ports: 
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: password
    volumes:
      - ./init-scripts:/docker-entrypoint-initdb.d
      
  # Frontend React (perfil opcional)
  # Para activarlo: docker compose --profile frontend up -d
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm ci || npm i && npm run dev -- --host 0.0.0.0"
    environment:
      - VITE_API_URL=http://localhost:8080
    ports:
      - "5173:5173"
    profiles: ["frontend"]
